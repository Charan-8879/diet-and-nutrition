# Healthify Spring Boot & MySQL Configuration

# Server Port
server.port=8080

# Spring Application Name
spring.application.name=healthify-backend

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/healthify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Healthify@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# GroqCloud API Configuration (loaded from env or fallback)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.vision.model=${GROQ_VISION_MODEL:llama-3.2-11b-vision-preview}

# Logging
logging.level.com.healthify=INFO
logging.level.org.springframework.web=INFO
